# /etc/nginx/snippets/basharaf-proxy.conf — included by every basharaf server block.

# resume uploads (data URI up to ~8 MB) and Excel imports; Next's server actions allow 10 MB
client_max_body_size 12m;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

# the app sends its own security headers (next.config.mjs); only HSTS is added per server block

# hashed build assets never change; Next already sends "Cache-Control: public, max-age=31536000, immutable".
location /_next/static/ {
  proxy_pass http://basharaf_app;
  proxy_set_header Host $host;
}

# branded menu: middleware rewrites /safasity/menu → /m with Next's own https://localhost:3001 address,
# which fails behind this proxy (EPROTO). Do the same rewrite here; the visitor's URL does not change.
location ^~ /safasity/menu {
  rewrite ^/safasity/menu(/.*)?$ /m$1 break;
  proxy_pass http://basharaf_app;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location / {
  proxy_pass http://basharaf_app;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  # reports and imports can take longer than a page
  proxy_read_timeout 120s;
  # middleware redirects are built from Next's own address; send visitors a relative Location instead
  proxy_redirect ~^https?://(localhost|127\.0\.0\.1):3001/(.*)$ /$2;
}
